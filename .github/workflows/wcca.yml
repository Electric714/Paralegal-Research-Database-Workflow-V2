name: WCCA Adapter

on:
  push:
    branches: [main]
    paths:
      - "backend/app/research/sources/wcca.py"
      - "backend/app/research/sources/wcca_browser.py"
      - "backend/app/research/source_registry.py"
      - "backend/app/wcca_api.py"
      - "backend/app/sources.py"
      - "backend/tests/test_wcca.py"
      - "backend/tests/test_wcca_browser.py"
      - "backend/tests/test_wcca_api.py"
      - "docs/sources/WCCA.md"
      - "docs/sources/WCCA-IMPLEMENTATION-NOTE.md"
      - ".github/workflows/wcca.yml"
  workflow_dispatch:

jobs:
  wcca-regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - name: Verify registered adapter contract
        run: |
          python - <<'PY'
          from app.research.source_registry import create_source
          from app.research.sources.wcca_browser import WccaPublicBrowserSource
          source = create_source("wcca")
          assert isinstance(source, WccaPublicBrowserSource)
          health = source.health_check()
          assert health["status"] == "ready_public_browser"
          assert health["public_site_automation"] is True
          assert health["rest_api_used"] is False
          assert health["captcha_bypass"] is False
          print(health)
          PY
      - name: Run WCCA regression tests
        run: pytest -q tests/test_wcca.py tests/test_wcca_browser.py tests/test_wcca_api.py
