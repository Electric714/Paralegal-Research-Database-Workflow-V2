name: Temporary WisDOT Live Audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wisdot-live-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Patch WisDOT extraction fallback and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('backend/app/research/sources/wisdot.py')
          source = source_path.read_text(encoding='utf-8')
          old = '''def _extract_pdf_text(data: bytes) -> str:\n    reader = PdfReader(io.BytesIO(data))\n    pages: list[str] = []\n    for page in reader.pages:\n        try:\n            text = page.extract_text(extraction_mode="layout") or ""\n        except TypeError:\n            text = page.extract_text() or ""\n        pages.append(text)\n    return "\\n\\f\\n".join(pages)\n'''
          new = '''def _extract_pdf_text(data: bytes) -> str:\n    reader = PdfReader(io.BytesIO(data))\n    pages: list[str] = []\n    for page in reader.pages:\n        layout_text = ""\n        try:\n            layout_text = page.extract_text(extraction_mode="layout") or ""\n        except TypeError:\n            pass\n\n        # Some WisDOT PDFs contain rotated/table text that pypdf's layout mode\n        # drops entirely even though ordinary extraction can read it. Prefer the\n        # layout representation when it is substantive, but fall back per page\n        # when it contains only a small fraction of the plain extraction.\n        plain_text = page.extract_text() or ""\n        layout_size = len(re.sub(r"\\s+", "", layout_text))\n        plain_size = len(re.sub(r"\\s+", "", plain_text))\n        if plain_size and (not layout_text.strip() or layout_size < plain_size // 3):\n            text = plain_text\n        else:\n            text = layout_text or plain_text\n        pages.append(text)\n    return "\\n\\f\\n".join(pages)\n'''
          if old not in source:
              raise SystemExit('Expected WisDOT extractor block was not found')
          source_path.write_text(source.replace(old, new), encoding='utf-8')

          test_path = Path('backend/tests/test_wisdot_current_debarment_layout.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'Apex Commercial Construction, Inc. dba Kuehne Company\n6830 S. Howell Ave',
              'Apex Commercial Construction, Inc. dba \nKuehne Company\n6830 S. Howell Ave',
          )
          marker = 'def test_pdf_extractor_falls_back_when_layout_mode_drops_table_pages'
          if marker not in tests:
              tests += '''\n\ndef test_pdf_extractor_falls_back_when_layout_mode_drops_table_pages(monkeypatch):\n    import app.research.sources.wisdot as wisdot_module\n\n    class FakePage:\n        def __init__(self, layout: str, plain: str):\n            self.layout = layout\n            self.plain = plain\n\n        def extract_text(self, extraction_mode=None):\n            return self.layout if extraction_mode == "layout" else self.plain\n\n    class FakeReader:\n        pages = [\n            FakePage("memo layout", "memo plain"),\n            FakePage(\n                "",\n                "Oak Creek, WI 53154\\nApex Commercial Construction, Inc. dba Kuehne Company\\n"\n                "6830 S. Howell Ave\\n12/5/2024 12/5/2027 Debarment Statewide WisDOT 1, 3",\n            ),\n        ]\n\n    monkeypatch.setattr(wisdot_module, "PdfReader", lambda _stream: FakeReader())\n    extracted = wisdot_module._extract_pdf_text(b"%PDF-test")\n\n    assert "memo layout" in extracted\n    assert "Apex Commercial Construction" in extracted\n    assert "12/5/2024 12/5/2027 Debarment" in extracted\n'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Run targeted WisDOT parser tests first
        working-directory: backend
        run: pytest -q tests/test_wisdot_source.py tests/test_wisdot_current_debarment_layout.py
      - name: Run full backend test suite
        working-directory: backend
        run: pytest -q
      - name: Create local validated-fix commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/research/sources/wisdot.py backend/tests/test_wisdot_current_debarment_layout.py
          git commit -m "Handle WisDOT PDF pages dropped by layout extraction"
      - name: Targeted live WisDOT worker test
        shell: bash
        run: |
          set +e
          python scripts/live_audit.py --bidder-csv "Bidder Database-Example.csv" --source wisdot --limit 1 --timeout 240
          code=$?
          echo "$code" > .runtime/wisdot-targeted-exit-code.txt
          exit 0
      - name: Full 24-bidder WisDOT live audit
        shell: bash
        run: |
          set +e
          python scripts/live_audit.py --bidder-csv "Bidder Database-Example.csv" --source wisdot --limit 0 --timeout 240
          code=$?
          echo "$code" > .runtime/wisdot-full-exit-code.txt
          exit 0
      - name: Upload WisDOT audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisdot-live-audit-v3
          path: |
            .runtime/live-audits
            .runtime/wisdot-targeted-exit-code.txt
            .runtime/wisdot-full-exit-code.txt
          if-no-files-found: error
      - name: Push validated WisDOT fix
        shell: bash
        run: |
          test "$(cat .runtime/wisdot-targeted-exit-code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.runtime/live-audits/latest.json').read_text(encoding='utf-8'))
          source = next(item for item in report['sources'] if item['source'] == 'wisdot')
          checks = source.get('checks') or []
          allowed = {'SUCCESS_NO_MATCH', 'SUCCESS_COMPLETE', 'SUCCESS_WITH_FINDINGS', 'AMBIGUOUS_MATCH'}
          assert len(checks) == 24, f'Expected 24 WisDOT checks, got {len(checks)}'
          assert all(check.get('completeness_status') == 'COMPLETE' for check in checks), checks
          assert all(check.get('status') in allowed for check in checks), checks
          PY
          git push origin HEAD:main
