name: OSHA Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/app/research/sources/osha.py
      - backend/app/research/sources/osha_bulk.py
      - backend/app/research/sources/osha_operational.py
      - backend/app/research/sources/osha_indexed.py
      - backend/app/research/sources/osha_resilient.py
      - backend/app/research/source_registry.py
      - backend/tests/test_osha_source.py
      - backend/tests/test_osha_bulk.py
      - backend/tests/test_osha_operational.py
      - backend/tests/test_osha_indexed.py
      - backend/tests/test_resilient_bbb_osha.py
      - scripts/osha_live_audit.py
      - scripts/refresh_osha_bulk.py
      - .github/workflows/osha-regression.yml

permissions:
  contents: read

jobs:
  osha-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile OSHA modules
        working-directory: backend
        run: |
          python -m py_compile \
            app/research/sources/osha.py \
            app/research/sources/osha_bulk.py \
            app/research/sources/osha_operational.py \
            app/research/sources/osha_indexed.py \
            app/research/sources/osha_resilient.py \
            app/research/source_registry.py
      - name: Run OSHA regression suite
        working-directory: backend
        run: |
          pytest -q \
            tests/test_osha_source.py \
            tests/test_osha_bulk.py \
            tests/test_osha_operational.py \
            tests/test_osha_indexed.py \
            tests/test_resilient_bbb_osha.py